<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 690" role="img" aria-label="오케스트레이션 흐름. Claude가 설계와 검증 게이트를 맡고, Codex 워커가 모든 구현을 한다. 선행 A와 B는 게이트로 나뉘고, 그 뒤 세 워커가 병렬로 돈다." font-family="system-ui, -apple-system, 'Apple SD Gothic Neo', sans-serif" fill="currentColor" stroke="currentColor">
  <title>Memonowz 오케스트레이션 흐름</title>
  <desc>왼쪽 레인은 Claude 코디네이터(설계·검증·통합), 오른쪽 레인은 Codex 워커(구현). 선행 A → 게이트 A → 선행 B → 게이트 B → 병렬 3워커 → 통합 순으로 흐른다.</desc>

  <defs>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" stroke="none"/>
    </marker>
    <marker id="a2g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1F5A6B" stroke="none"/>
    </marker>
  </defs>

  <text x="20" y="28" font-size="15" font-weight="600" stroke="none">Claude는 설계하고 검증한다 · Codex는 구현한다</text>

  <!-- lanes -->
  <line x1="40" y1="50" x2="40" y2="660" stroke-dasharray="4 5" opacity="0.3"/>
  <line x1="300" y1="50" x2="300" y2="660" stroke-dasharray="4 5" opacity="0.3"/>
  <line x1="820" y1="50" x2="820" y2="660" stroke-dasharray="4 5" opacity="0.3"/>

  <text x="48" y="66" font-size="12" font-weight="600" stroke="none" opacity="0.75">Claude — 코디네이터</text>
  <text x="368" y="66" font-size="12" font-weight="600" stroke="none" opacity="0.75">Codex 워커 — gpt-5.6-luna / xhigh</text>

  <!-- 1. spec -->
  <rect x="48" y="84" width="244" height="52" rx="8" fill="none"/>
  <text x="64" y="106" font-size="13" font-weight="600" stroke="none">스펙 · 구현 계획 작성</text>
  <text x="64" y="124" font-size="11" stroke="none" opacity="0.65">브레인스토밍 → 디자인 게이트 → 계획</text>

  <!-- dispatch A -->
  <line x1="292" y1="128" x2="368" y2="160" marker-end="url(#ar)" opacity="0.85" stroke="currentColor"/>
  <text x="296" y="150" font-size="11" stroke="none" opacity="0.7">dispatch — 계획서 원문을 가리킨다</text>

  <!-- 2. worker A -->
  <rect x="368" y="152" width="444" height="52" rx="8" fill="none"/>
  <text x="384" y="174" font-size="13" font-weight="600" stroke="none">선행 A — 스캐폴딩 · types · db</text>
  <text x="384" y="192" font-size="11" stroke="none" opacity="0.65">계약을 만든다. 세 병렬 워커가 나중에 이걸 그대로 보고 짠다</text>

  <!-- worker_done -->
  <line x1="368" y1="212" x2="292" y2="240" marker-start="url(#ar)" opacity="0.85"/>
  <text x="316" y="232" font-size="11" stroke="none" opacity="0.7">worker_done</text>

  <!-- gate A -->
  <rect x="48" y="232" width="244" height="62" rx="8" fill="none" stroke="#1F5A6B" stroke-width="2"/>
  <text x="64" y="254" font-size="13" font-weight="600" stroke="none" fill="#1F5A6B">게이트 A — 계약 대조</text>
  <text x="64" y="272" font-size="11" stroke="none" fill="#1F5A6B" opacity="0.85">pnpm test 12개 통과</text>
  <text x="64" y="288" font-size="11" stroke="none" fill="#1F5A6B" opacity="0.85">타입·함수 시그니처를 계획서와 한 줄씩</text>

  <!-- dispatch B -->
  <line x1="292" y1="288" x2="368" y2="318" marker-end="url(#ar)" opacity="0.85"/>
  <text x="296" y="310" font-size="11" stroke="none" opacity="0.7">dispatch — 같은 세션 이어서</text>

  <!-- worker B -->
  <rect x="368" y="310" width="444" height="52" rx="8" fill="none"/>
  <text x="384" y="332" font-size="13" font-weight="600" stroke="none">선행 B — ui · card · 라우팅 · 저장소 경고</text>
  <text x="384" y="350" font-size="11" stroke="none" opacity="0.65">공유 컴포넌트. 없으면 세 워커가 버튼을 세 종류 만든다</text>

  <line x1="368" y1="370" x2="292" y2="398" marker-start="url(#ar)" opacity="0.85"/>
  <text x="316" y="390" font-size="11" stroke="none" opacity="0.7">worker_done</text>

  <!-- gate B -->
  <rect x="48" y="390" width="244" height="58" rx="8" fill="none" stroke="#1F5A6B" stroke-width="2"/>
  <text x="64" y="412" font-size="13" font-weight="600" stroke="none" fill="#1F5A6B">게이트 B — 빌드 · 화면</text>
  <text x="64" y="430" font-size="11" stroke="none" fill="#1F5A6B" opacity="0.85">토큰 · 다크모드 · 폰트 번들 확인</text>

  <!-- fan out -->
  <line x1="292" y1="442" x2="440" y2="492" marker-end="url(#a2g)" stroke="#1F5A6B" opacity="0.8"/>
  <line x1="292" y1="446" x2="590" y2="492" marker-end="url(#a2g)" stroke="#1F5A6B" opacity="0.8"/>
  <line x1="292" y1="450" x2="740" y2="492" marker-end="url(#a2g)" stroke="#1F5A6B" opacity="0.8"/>
  <text x="300" y="478" font-size="11" stroke="none" fill="#1F5A6B" opacity="0.85">워크트리 3개로 갈라진다 — 서로를 보지 못한다</text>

  <rect x="368" y="494" width="144" height="66" rx="8" fill="none" stroke="#1F5A6B"/>
  <text x="440" y="518" font-size="13" font-weight="600" text-anchor="middle" stroke="none" fill="#1F5A6B">deck</text>
  <text x="440" y="536" font-size="11" text-anchor="middle" stroke="none" fill="#1F5A6B" opacity="0.8">홈 · 덱 상세</text>
  <text x="440" y="551" font-size="11" text-anchor="middle" stroke="none" fill="#1F5A6B" opacity="0.8">카드 CRUD</text>

  <rect x="518" y="494" width="144" height="66" rx="8" fill="none" stroke="#1F5A6B"/>
  <text x="590" y="518" font-size="13" font-weight="600" text-anchor="middle" stroke="none" fill="#1F5A6B">study</text>
  <text x="590" y="536" font-size="11" text-anchor="middle" stroke="none" fill="#1F5A6B" opacity="0.8">출제 엔진</text>
  <text x="590" y="551" font-size="11" text-anchor="middle" stroke="none" fill="#1F5A6B" opacity="0.8">세션 · 결과</text>

  <rect x="668" y="494" width="144" height="66" rx="8" fill="none" stroke="#1F5A6B"/>
  <text x="740" y="518" font-size="13" font-weight="600" text-anchor="middle" stroke="none" fill="#1F5A6B">import</text>
  <text x="740" y="536" font-size="11" text-anchor="middle" stroke="none" fill="#1F5A6B" opacity="0.8">파서 · 검증</text>
  <text x="740" y="551" font-size="11" text-anchor="middle" stroke="none" fill="#1F5A6B" opacity="0.8">임포트 · 설정</text>

  <!-- ask arrow -->
  <path d="M 368 560 C 330 580, 320 570, 292 556" fill="none" stroke-dasharray="4 4" marker-end="url(#ar)" opacity="0.7"/>
  <text x="300" y="596" font-size="11" stroke="none" opacity="0.7">ask — 공유 모듈을 고쳐야 할 때</text>
  <text x="300" y="612" font-size="11" stroke="none" opacity="0.55">코디네이터가 고치고 셋 모두에게 알린다</text>

  <!-- integrate -->
  <line x1="440" y1="562" x2="220" y2="626" marker-end="url(#ar)" opacity="0.6"/>
  <line x1="590" y1="562" x2="230" y2="628" marker-end="url(#ar)" opacity="0.6"/>
  <line x1="740" y1="562" x2="240" y2="630" marker-end="url(#ar)" opacity="0.6"/>

  <rect x="48" y="630" width="244" height="44" rx="8" fill="none" stroke="#1F5A6B" stroke-width="2"/>
  <text x="64" y="650" font-size="13" font-weight="600" stroke="none" fill="#1F5A6B">통합 — 머지 · 계약 grep</text>
  <text x="64" y="666" font-size="11" stroke="none" fill="#1F5A6B" opacity="0.85">전 루프 브라우저 검증</text>
</svg>
